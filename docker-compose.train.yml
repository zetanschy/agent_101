# Training-only compose: GPU + dataset, NO robot devices / cameras / X11.
# Use on a cloud GPU box (or any machine) to fine-tune from a pushed dataset.
#   ./robot train --dataset <id> --name <run>          <- normal way (forwards secrets)
#   docker compose -f docker-compose.train.yml run --rm train bash scripts/train.sh ...
services:
  train:
    build: .
    image: agent101/lerobot
    working_dir: /workspace
    env_file:
      - .env                       # shared config (WANDB_PROJECT, dataset defaults)
      # HF_TOKEN (private datasets + checkpoint push) and WANDB_API_KEY, written by
      # `./robot login`. Optional + gitignored; keep secrets OUT of tracked .env.
      # NOTE: deliberately not repeated under `environment:` — an entry there that
      # interpolates to empty would override these with "". `./robot train` forwards
      # an exported value with `run -e`, which does take precedence.
      - path: .env.local
        required: false
    volumes:
      - ./:/workspace
      # Live-editable lerobot fork (patch thirdparty/le101 on the host).
      - ./thirdparty/le101:/opt/le101
      # HF cache: dataset + base model download here, and it persists.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    shm_size: "16gb"              # DataLoaders need it; more than the robot compose
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
